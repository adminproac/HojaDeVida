# Worker de la base D1 y del inicio de sesión con usuario y contraseña.
# El id de D1 no es un secreto.
# Los secretos GITHUB_CLIENT_ID y GITHUB_CLIENT_SECRET ya no se usan.
# Edgar puede borrarlos después en Cloudflare; no hace falta tocarlos para este cambio.
name = "hojadevida-oauth"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hojadevida"
database_id = "e2af3db8-e3bc-4041-b000-ab837c4e0fce"
migrations_dir = "migrations"
